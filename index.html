<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>今日の三毛猫さん</title>

<meta name="theme-color" content="#111110">

<style>
:root {
  --ink: #f3f0eb;
  --accent: #bdb6aa;
  --line: #827b73;
  --bg: #111110;
  --panel: rgba(255,255,255,.045);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family:
    system-ui,
    -apple-system,
    "Hiragino Kaku Gothic ProN",
    Meiryo,
    sans-serif;
  min-height: 100vh;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

header {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 18px 22px;
}

.quiet {
  padding: 9px 14px;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--line);
  transition: .25s;
}

.quiet:hover {
  color: #111;
  background: #f4f1ec;
}

main {
  width: min(900px, calc(100% - 28px));
  margin: 0 auto;
  padding: 12px 0 48px;
  text-align: center;
}

.eyebrow {
  color: #a7a097;
  font-size: .75rem;
  letter-spacing: .25em;
}

h1 {
  margin: .3em 0 .15em;
  color: var(--accent);
  font-size: clamp(2rem, 5vw, 3.6rem);
  letter-spacing: .08em;
}

.description {
  margin-bottom: 24px;
  color: #c4beb5;
}

.cat-wrap {
  display: grid;
  place-items: center;
  width: min(100%, 650px);
  min-height: 220px;
  margin: 0 auto 18px;
}

.cat {
  width: 100%;
  max-height: 390px;
  object-fit: contain;
  filter: drop-shadow(0 15px 28px #0008);
}

#drawBtn {
  min-width: 220px;
  padding: 16px 36px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--ink);
  font-weight: 700;
  letter-spacing: .2em;
  transition:
    background .3s,
    color .3s,
    transform .2s;
}

#drawBtn:hover:not(:disabled) {
  transform: translateY(-2px);
  background: #050505;
  color: white;
  box-shadow: 0 0 0 1px var(--accent);
}

#drawBtn:disabled {
  transform: none;
}

.subnote {
  margin: 14px 0 22px;
  color: #a7a097;
  font-size: .85rem;
}

.actions,
.event-choices {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.event-choices {
  margin: 16px 0;
}

.panel {
  max-width: 780px;
  margin: 24px auto;
  padding: 20px;
  border: 1px solid var(--line);
  background: var(--panel);
  text-align: left;
}

.panel h2 {
  margin-top: 0;
}

.hidden {
  display: none !important;
}

label {
  display: block;
  margin: 12px 0 5px;
  color: #cfc9c0;
}

input,
textarea,
select {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 0;
  background: rgba(0,0,0,.35);
  color: var(--ink);
}

input[type="checkbox"] {
  width: auto;
}

input[type="file"] {
  padding: 8px;
}

input[type="color"] {
  min-height: 42px;
}

.row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
}

.btn {
  margin: 5px 5px 5px 0;
  padding: 10px 15px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: #111;
}

.btn:hover:not(:disabled) {
  background: transparent;
  color: var(--ink);
}

.danger {
  border-color: #a65e5e;
  background: transparent;
  color: #f0b4b4;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: transparent;
}

th,
td {
  padding: 9px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
}

th {
  color: var(--accent);
}

.scroll {
  overflow-x: auto;
}

.status {
  min-height: 1.5em;
  color: #d8c9a9;
}

#resultCard {
  position: relative;
  width: min(100%, 350px);
  margin: 20px auto;
  padding: 28px 18px;
  border: 2px solid #292929;
  background: #f7f6f2;
  color: #161616;
  box-shadow: 0 12px 35px #0006;
  text-align: center;
}

#resultCard::before {
  position: absolute;
  top: 8px;
  left: 10px;
  color: #aaa;
  content: "肉球";
  font-size: 11px;
}

#resultCard::after {
  display: block;
  margin-top: 16px;
  color: #777;
  content: "🐾";
  font-size: 27px;
}

#resultName {
  margin: 28px 0 0;
  font-size: 1.5rem;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.result-image {
  display: block;
  max-width: 100%;
  max-height: 180px;
  margin: 15px auto;
  object-fit: contain;
}

footer {
  padding: 24px;
  color: #777;
  font-size: .75rem;
  text-align: center;
}

.admin-message {
  min-height: 1.5em;
  margin: 10px 0;
  color: #d8c9a9;
  overflow-wrap: anywhere;
}

.item-preview {
  display: block;
  max-width: 70px;
  max-height: 70px;
  margin-top: 6px;
  object-fit: contain;
}

@media (max-width: 520px) {
  header {
    padding: 12px;
  }

  main {
    width: calc(100% - 20px);
  }

  .panel {
    padding: 14px;
  }

  th,
  td {
    padding: 7px;
    font-size: .88rem;
  }
}
</style>
</head>

<body>

<header>
  <button class="quiet" id="historyTop">当選履歴</button>
  <button class="quiet" id="adminTop">管理画面</button>
</header>

<main>

  <div class="eyebrow">A little luck, a little cat</div>

  <h1 id="pageTitle">今日の三毛猫さん</h1>

  <p class="description" id="pageDescription">
    気まぐれな三毛猫と遊ぼう
  </p>

  <div class="cat-wrap">
    <img
      class="cat"
      id="catImage"
      src="images/cats/mikeneko1.svg"
      alt="三毛猫さん"
    >
  </div>

  <div id="eventText" class="status">
    三毛猫があらわれた。
  </div>

  <div id="choiceArea" class="event-choices">
    <button class="quiet" data-choice="声を掛ける">
      声を掛ける
    </button>

    <button class="quiet" data-choice="撫でる">
      撫でる
    </button>
  </div>

  <button id="drawBtn">クジを引く</button>

  <div class="subnote" id="dailyNote">
    今日のクジは1回まで
  </div>

  <section id="resultArea" class="hidden">

    <div id="resultCard">
      <div id="resultName"></div>
      <img id="resultImage" class="result-image hidden" alt="当選アイテム">
    </div>

    <button class="btn" id="downloadBtn">
      当選カードをダウンロード
    </button>

    <p id="resultCaption"></p>

  </section>

  <section class="panel hidden" id="historyPanel">

    <h2>当選履歴</h2>

    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>日時</th>
            <th>当選アイテム</th>
          </tr>
        </thead>
        <tbody id="historyRows"></tbody>
      </table>
    </div>

    <button class="quiet" id="closeHistory">閉じる</button>

  </section>

  <section class="panel hidden" id="adminPanel">

    <h2>管理画面</h2>

    <p class="subnote">
      設定とアイテムは、このブラウザー内に保存されます。
    </p>

    <div id="loginArea">

      <label for="adminPassword">管理パスワード</label>

      <input
        id="adminPassword"
        type="password"
        autocomplete="current-password"
      >

      <button class="btn" id="loginBtn">ログイン</button>

      <div id="loginMessage" class="admin-message"></div>

    </div>

    <div id="adminContent" class="hidden">

      <h3>画面設定</h3>

      <div class="row">

        <div>
          <label for="settingTitle">タイトル</label>
          <input id="settingTitle">
        </div>

        <div>
          <label for="settingDescription">説明文</label>
          <input id="settingDescription">
        </div>

        <div>
          <label for="settingTextColor">文字色</label>
          <input id="settingTextColor" type="color">
        </div>

        <div>
          <label for="settingButtonColor">クジ引きボタン色</label>
          <input id="settingButtonColor" type="color">
        </div>

        <div>
          <label for="settingLineColor">線の色</label>
          <input id="settingLineColor" type="color">
        </div>

        <div>
          <label for="settingDailyLimit">1日のクジ回数</label>
          <input
            id="settingDailyLimit"
            type="number"
            min="1"
            step="1"
          >
        </div>

      </div>

      <label for="settingWinLine">当選時のセリフ（共通）</label>

      <input
        id="settingWinLine"
        placeholder="例：三毛猫さんからの贈り物！"
      >

      <h3>アイテム追加</h3>

      <div class="row">

        <div>
          <label for="newItemName">アイテム名</label>
          <input id="newItemName" placeholder="アイテム名">
        </div>

        <div>
          <label for="newItemQty">個数</label>
          <input
            id="newItemQty"
            type="number"
            min="1"
            step="1"
            value="1"
          >
        </div>

        <div>
          <label for="newItemRare">レア判定</label>
          <select id="newItemRare">
            <option value="normal">通常</option>
            <option value="rare">レア</option>
            <option value="super">超レア</option>
          </select>
        </div>

        <div>
          <label for="newItemImage">アイテム画像（任意）</label>
          <input
            id="newItemImage"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"
          >
        </div>

      </div>

      <label for="newItemInfo">追加情報（任意）</label>

      <textarea
        id="newItemInfo"
        rows="2"
        placeholder="アイテムの説明・メモ"
      ></textarea>

      <button class="btn" id="addItemBtn">アイテムを追加</button>

      <div id="adminStatus" class="admin-message" role="status"></div>

      <h3>アイテム一覧</h3>

      <div class="scroll">

        <table>
          <thead>
            <tr>
              <th>名称 / 追加情報</th>
              <th>個数</th>
              <th>レア</th>
              <th>画像</th>
              <th>操作</th>
            </tr>
          </thead>

          <tbody id="itemRows"></tbody>
        </table>

      </div>

      <p class="subnote">
        画像は小さく圧縮して保存します。
        画像を保存できない場合は、画像なしで追加することもできます。
      </p>

      <h3>JSON一括追加</h3>

      <label for="bulkItems">
        JSON形式でアイテムを追加
      </label>

      <textarea
        id="bulkItems"
        rows="5"
        placeholder='[{"name":"またたび","quantity":3,"rarity":"rare","info":"おやつ"}]'
      ></textarea>

      <button class="btn" id="bulkAddBtn">JSONから追加</button>

      <hr style="border-color:var(--line);margin:24px 0">

      <button class="btn" id="saveSettingsBtn">設定を保存</button>

      <button class="quiet" id="refreshAdminBtn">
        更新・再表示
      </button>

      <button class="quiet" id="resetDailyBtn">
        本日の回数をリセット
      </button>

      <button class="quiet" id="logoutBtn">ログアウト</button>

    </div>

  </section>

  <footer>
    今日の運勢は三毛猫さんの気分しだい。
  </footer>

</main>

<script>
"use strict";

/* =========================================
   基本設定
========================================= */

// SHA-256ハッシュによる照合。
// これは簡易的な画面ロックであり、サーバー側の認証ではありません。
const PASSWORD_HASH =
  "ab51004e9d71a485f160f655fb9e72bcdef8f5ca4178b26938b49471456fd11c";

const STORAGE = {
  state: "mikeneko_state",
  history: "mikeneko_history",
  draws: "mikeneko_draws"
};

const defaults = {
  title: "今日の三毛猫さん",
  description: "気まぐれな三毛猫と遊ぼう",
  textColor: "#f3f0eb",
  buttonColor: "#bdb6aa",
  lineColor: "#827b73",
  dailyLimit: 1,
  winLine: "三毛猫さんからの贈り物！",
  items: [
    {
      id: 1,
      name: "猫じゃらし",
      quantity: 1,
      remaining: 1,
      rarity: "normal",
      image: "",
      info: ""
    },
    {
      id: 2,
      name: "またたび",
      quantity: 1,
      remaining: 1,
      rarity: "rare",
      image: "",
      info: ""
    },
    {
      id: 3,
      name: "お魚のおもちゃ",
      quantity: 1,
      remaining: 1,
      rarity: "normal",
      image: "",
      info: ""
    }
  ]
};

/* =========================================
   データ保存・読み込み
========================================= */

function today() {
  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
}

function cloneDefaults() {
  return JSON.parse(JSON.stringify(defaults));
}

function loadJSON(key, fallback) {
  try {
    const value = localStorage.getItem(key);

    if (value === null) {
      return fallback;
    }

    return JSON.parse(value);
  } catch (error) {
    console.error("読み込みエラー:", key, error);
    return fallback;
  }
}

function loadState() {
  const saved = loadJSON(STORAGE.state, null);

  if (!saved || typeof saved !== "object") {
    return cloneDefaults();
  }

  const base = cloneDefaults();

  return {
    ...base,
    ...saved,
    items: Array.isArray(saved.items)
      ? saved.items.map(item => ({
          id: item.id ?? Date.now() + Math.random(),
          name: String(item.name ?? ""),
          quantity: Math.max(0, Number(item.quantity) || 0),
          remaining: Math.max(
            0,
            Number(item.remaining ?? item.quantity) || 0
          ),
          rarity: ["normal", "rare", "super"].includes(item.rarity)
            ? item.rarity
            : "normal",
          image: typeof item.image === "string" ? item.image : "",
          info: String(item.info ?? "")
        }))
      : base.items
  };
}

let state = loadState();

let history = loadJSON(STORAGE.history, []);

if (!Array.isArray(history)) {
  history = [];
}

let draws = loadJSON(STORAGE.draws, {
  date: today(),
  count: 0
});

if (!draws || typeof draws !== "object") {
  draws = { date: today(), count: 0 };
}

draws.count = Math.max(0, Number(draws.count) || 0);

let admin = false;
let currentItem = null;

/*
 * まとめて保存します。
 * 保存に失敗した場合は例外を呼び出し元へ返します。
 */
function saveAll() {
  localStorage.setItem(STORAGE.state, JSON.stringify(state));
  localStorage.setItem(STORAGE.history, JSON.stringify(history));
  localStorage.setItem(STORAGE.draws, JSON.stringify(draws));
}

function safeSave() {
  try {
    saveAll();
    return true;
  } catch (error) {
    console.error("保存エラー:", error);
    return false;
  }
}

function rollDay() {
  if (draws.date !== today()) {
    draws = {
      date: today(),
      count: 0
    };

    state.items.forEach(item => {
      item.remaining = item.quantity;
    });

    safeSave();
  }
}

/* =========================================
   画面設定
========================================= */

function applyTheme() {
  document.documentElement.style.setProperty(
    "--ink",
    state.textColor
  );

  document.documentElement.style.setProperty(
    "--accent",
    state.buttonColor
  );

  document.documentElement.style.setProperty(
    "--line",
    state.lineColor
  );

  document.getElementById("pageTitle").textContent = state.title;
  document.getElementById("pageDescription").textContent =
    state.description;
}

function showCat() {
  const number = 1 + Math.floor(Math.random() * 3);

  const image = document.getElementById("catImage");

  image.src = `images/cats/mikeneko${number}.svg`;

  image.onerror = () => {
    image.onerror = null;
    image.alt = "三毛猫画像を読み込めませんでした";
  };
}

function updateDraw() {
  rollDay();

  const limit = Math.max(1, Number(state.dailyLimit) || 1);

  const remaining = Math.max(0, limit - draws.count);

  const button = document.getElementById("drawBtn");
  const note = document.getElementById("dailyNote");

  button.disabled = remaining < 1;

  note.textContent = remaining > 0
    ? `今日のクジはあと${remaining}回`
    : "本日のクジは終了しました。また明日遊んでね。";
}

/* =========================================
   管理画面・アイテム一覧
========================================= */

function setAdminStatus(message) {
  document.getElementById("adminStatus").textContent = message;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function renderItems() {
  const body = document.getElementById("itemRows");

  body.replaceChildren();

  if (state.items.length === 0) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");

    td.colSpan = 5;
    td.textContent = "登録されているアイテムはありません。";

    tr.appendChild(td);
    body.appendChild(tr);

    return;
  }

  state.items.forEach(item => {
    const tr = document.createElement("tr");

    const nameCell = document.createElement("td");

    const nameInput = document.createElement("input");
    nameInput.dataset.edit = "name";
    nameInput.dataset.id = item.id;
    nameInput.value = item.name;
    nameInput.setAttribute("aria-label", "アイテム名");

    const infoInput = document.createElement("textarea");
    infoInput.dataset.edit = "info";
    infoInput.dataset.id = item.id;
    infoInput.rows = 2;
    infoInput.value = item.info || "";
    infoInput.setAttribute("aria-label", "追加情報");

    nameCell.append(nameInput, infoInput);

    const quantityCell = document.createElement("td");

    const quantityInput = document.createElement("input");
    quantityInput.type = "number";
    quantityInput.min = "0";
    quantityInput.step = "1";
    quantityInput.style.width = "75px";
    quantityInput.dataset.edit = "quantity";
    quantityInput.dataset.id = item.id;
    quantityInput.value = item.quantity;
    quantityInput.setAttribute("aria-label", "個数");

    quantityCell.appendChild(quantityInput);

    const rarityCell = document.createElement("td");

    const raritySelect = document.createElement("select");
    raritySelect.dataset.edit = "rarity";
    raritySelect.dataset.id = item.id;

    [
      ["normal", "通常"],
      ["rare", "レア"],
      ["super", "超レア"]
    ].forEach(([value, label]) => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = label;
      raritySelect.appendChild(option);
    });

    raritySelect.value = item.rarity || "normal";
    rarityCell.appendChild(raritySelect);

    const imageCell = document.createElement("td");

    imageCell.textContent = item.image ? "画像あり" : "画像なし";

    if (item.image) {
      const preview = document.createElement("img");

      preview.className = "item-preview";
      preview.src = item.image;
      preview.alt = "アイテム画像";

      imageCell.appendChild(preview);
    }

    const operationCell = document.createElement("td");

    const deleteButton = document.createElement("button");

    deleteButton.className = "quiet danger";
    deleteButton.textContent = "削除";
    deleteButton.dataset.delete = item.id;

    operationCell.appendChild(deleteButton);

    tr.append(
      nameCell,
      quantityCell,
      rarityCell,
      imageCell,
      operationCell
    );

    body.appendChild(tr);
  });
}

function renderHistory() {
  const body = document.getElementById("historyRows");

  body.replaceChildren();

  history.slice().reverse().forEach(record => {
    const tr = document.createElement("tr");

    const dateCell = document.createElement("td");
    const itemCell = document.createElement("td");

    dateCell.textContent = record.date || "";
    itemCell.textContent = record.item || "";

    tr.append(dateCell, itemCell);
    body.appendChild(tr);
  });

  if (history.length === 0) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");

    td.colSpan = 2;
    td.textContent = "まだ当選履歴はありません。";

    tr.appendChild(td);
    body.appendChild(tr);
  }
}

function openPanel(id) {
  document.getElementById(id).classList.remove("hidden");
}

function closePanel(id) {
  document.getElementById(id).classList.add("hidden");
}

function showAdmin() {
  document.getElementById("loginArea").classList.add("hidden");

  document.getElementById("adminContent").classList.remove("hidden");

  document.getElementById("settingTitle").value = state.title;
  document.getElementById("settingDescription").value =
    state.description;

  document.getElementById("settingTextColor").value =
    state.textColor;

  document.getElementById("settingButtonColor").value =
    state.buttonColor;

  document.getElementById("settingLineColor").value =
    state.lineColor;

  document.getElementById("settingDailyLimit").value =
    state.dailyLimit;

  document.getElementById("settingWinLine").value =
    state.winLine;

  renderItems();
}

function refreshAdmin() {
  state = loadState();

  history = loadJSON(STORAGE.history, []);

  if (!Array.isArray(history)) {
    history = [];
  }

  draws = loadJSON(STORAGE.draws, {
    date: today(),
    count: 0
  });

  rollDay();
  applyTheme();
  updateDraw();
  renderHistory();

  if (admin) {
    showAdmin();
  }

  setAdminStatus("保存済みのデータを読み込みました。");
}

/* =========================================
   画像の圧縮
========================================= */

async function compressItemImage(file) {
  if (!file) {
    return "";
  }

  if (!file.type.startsWith("image/")) {
    throw new Error("画像ファイルを選択してください。");
  }

  const maxFileSize = 15 * 1024 * 1024;

  if (file.size > maxFileSize) {
    throw new Error(
      "画像ファイルが大きすぎます。15MB以下の画像を選択してください。"
    );
  }

  /*
   * SVG、GIF、PNGなども読み込めるものはJPEGに変換します。
   * アニメーションGIFは静止画になります。
   */
  const objectURL = URL.createObjectURL(file);

  let image;

  try {
    image = await new Promise((resolve, reject) => {
      const img = new Image();

      img.onload = () => resolve(img);

      img.onerror = () => {
        reject(
          new Error(
            "画像を読み込めませんでした。別の画像をお試しください。"
          )
        );
      };

      img.src = objectURL;
    });
  } finally {
    URL.revokeObjectURL(objectURL);
  }

  const maxSize = 700;

  const scale = Math.min(
    1,
    maxSize / image.width,
    maxSize / image.height
  );

  const canvas = document.createElement("canvas");

  canvas.width = Math.max(1, Math.round(image.width * scale));
  canvas.height = Math.max(1, Math.round(image.height * scale));

  const context = canvas.getContext("2d");

  if (!context) {
    throw new Error("画像の処理に失敗しました。");
  }

  // JPEGの透過部分は白背景にする
  context.fillStyle = "#ffffff";
  context.fillRect(0, 0, canvas.width, canvas.height);

  context.drawImage(
    image,
    0,
    0,
    canvas.width,
    canvas.height
  );

  const blob = await new Promise((resolve, reject) => {
    canvas.toBlob(
      result => {
        if (!result) {
          reject(new Error("画像の圧縮に失敗しました。"));
          return;
        }

        resolve(result);
      },
      "image/jpeg",
      0.72
    );
  });

  return await new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);

    reader.onerror = () => {
      reject(new Error("画像データの読み込みに失敗しました。"));
    };

    reader.readAsDataURL(blob);
  });
}

/* =========================================
   アイテム追加
========================================= */

document.getElementById("addItemBtn").onclick = async () => {
  if (!admin) {
    alert("管理画面にログインしてください。");
    return;
  }

  const button = document.getElementById("addItemBtn");

  const nameInput = document.getElementById("newItemName");
  const quantityInput = document.getElementById("newItemQty");
  const imageInput = document.getElementById("newItemImage");
  const infoInput = document.getElementById("newItemInfo");
  const rarityInput = document.getElementById("newItemRare");

  const name = nameInput.value.trim();

  if (!name) {
    alert("アイテム名を入力してください。");
    nameInput.focus();
    return;
  }

  const quantityValue = Number(quantityInput.value);

  if (
    !Number.isFinite(quantityValue) ||
    !Number.isInteger(quantityValue) ||
    quantityValue < 1
  ) {
    alert("個数は1以上の整数を入力してください。");
    quantityInput.focus();
    return;
  }

  button.disabled = true;
  button.textContent = "追加中…";
  setAdminStatus("アイテムを追加しています…");

  try {
    const file = imageInput.files[0];

    let imageData = "";

    if (file) {
      imageData = await compressItemImage(file);
    }

    const newItem = {
      id: Date.now() + Math.random(),
      name,
      quantity: quantityValue,
      remaining: quantityValue,
      rarity: rarityInput.value,
      image: imageData,
      info: infoInput.value.trim()
    };

    const previousItems = state.items;

    state.items = [...previousItems, newItem];

    try {
      saveAll();
    } catch (error) {
      state.items = previousItems;

      if (
        error.name === "QuotaExceededError" ||
        error.name === "NS_ERROR_DOM_QUOTA_REACHED"
      ) {
        throw new Error(
          "ブラウザーの保存容量が不足しています。" +
          "画像を小さくするか、画像なしで追加してください。"
        );
      }

      throw error;
    }

    renderItems();
    updateDraw();

    nameInput.value = "";
    infoInput.value = "";
    imageInput.value = "";

    setAdminStatus("アイテムを追加し、保存しました。");

  } catch (error) {
    console.error("アイテム追加エラー:", error);

    setAdminStatus(
      "追加に失敗しました：" +
      (error.message || "原因不明のエラー")
    );

    alert(
      "アイテムを追加できませんでした。\n\n" +
      (error.message || "ブラウザーの保存領域を確認してください。")
    );

  } finally {
    button.disabled = false;
    button.textContent = "アイテムを追加";
  }
};

document.getElementById("saveSettingsBtn").onclick = () => {
  if (!admin) {
    return;
  }

  const title = document.getElementById("settingTitle").value.trim();

  const dailyLimit = Number(
    document.getElementById("settingDailyLimit").value
  );

  if (
    !Number.isInteger(dailyLimit) ||
    dailyLimit < 1
  ) {
    alert("1日のクジ回数は1以上の整数を入力してください。");
    return;
  }

  const previousState = JSON.stringify(state);

  state.title = title || defaults.title;

  state.description =
    document.getElementById("settingDescription").value;

  state.textColor =
    document.getElementById("settingTextColor").value;

  state.buttonColor =
    document.getElementById("settingButtonColor").value;

  state.lineColor =
    document.getElementById("settingLineColor").value;

  state.dailyLimit = dailyLimit;

  state.winLine =
    document.getElementById("settingWinLine").value;

  document.querySelectorAll("[data-edit]").forEach(element => {
    const item = state.items.find(
      entry => String(entry.id) === String(element.dataset.id)
    );

    if (!item) {
      return;
    }

    const key = element.dataset.edit;

    if (key === "quantity") {
      const quantity = Number(element.value);

      if (
        !Number.isInteger(quantity) ||
        quantity < 0
      ) {
        return;
      }

      item.quantity = quantity;
      item.remaining = Math.min(item.remaining, quantity);

    } else if (key === "rarity") {
      if (["normal", "rare", "super"].includes(element.value)) {
        item.rarity = element.value;
      }

    } else if (key === "name") {
      item.name = element.value.trim();

    } else if (key === "info") {
      item.info = element.value;
    }
  });

  if (!safeSave()) {
    state = JSON.parse(previousState);

    alert(
      "保存に失敗しました。ブラウザーの保存容量を確認してください。"
    );

    showAdmin();
    return;
  }

  applyTheme();
  updateDraw();
  renderItems();

  setAdminStatus("設定を保存しました。");

  alert("設定を保存しました。");
};

/* =========================================
   JSON一括追加
========================================= */

document.getElementById("bulkAddBtn").onclick = () => {
  if (!admin) {
    return;
  }

  const textarea = document.getElementById("bulkItems");

  let array;

  try {
    array = JSON.parse(textarea.value);

    if (!Array.isArray(array)) {
      throw new Error("JSONは配列形式で入力してください。");
    }

  } catch (error) {
    alert(
      "JSONの形式を確認してください。\n" +
      error.message
    );

    return;
  }

  const newItems = [];

  for (const entry of array) {
    if (
      !entry ||
      typeof entry.name !== "string" ||
      !entry.name.trim()
    ) {
      alert("すべてのアイテムにname（名前）が必要です。");
      return;
    }

    const quantity = Number(entry.quantity ?? 1);

    if (
      !Number.isInteger(quantity) ||
      quantity < 0
    ) {
      alert("個数は0以上の整数を入力してください。");
      return;
    }

    newItems.push({
      id: Date.now() + Math.random(),
      name: entry.name.trim(),
      quantity,
      remaining: quantity,
      rarity: ["normal", "rare", "super"].includes(entry.rarity)
        ? entry.rarity
        : "normal",
      image: typeof entry.image === "string" ? entry.image : "",
      info: String(entry.info ?? "")
    });
  }

  const previousItems = state.items;

  state.items = [...previousItems, ...newItems];

  if (!safeSave()) {
    state.items = previousItems;

    alert(
      "保存に失敗しました。ブラウザーの保存容量を確認してください。"
    );

    return;
  }

  renderItems();
  updateDraw();

  textarea.value = "";

  setAdminStatus(`${newItems.length}件のアイテムを追加しました。`);

  alert(`${newItems.length}件のアイテムを追加しました。`);
};

/* =========================================
   抽選
========================================= */

document.getElementById("drawBtn").onclick = () => {
  rollDay();

  const limit = Math.max(1, Number(state.dailyLimit) || 1);

  if (draws.count >= limit) {
    updateDraw();
    return;
  }

  const pool = state.items.filter(
    item => Number(item.remaining) > 0
  );

  if (pool.length === 0) {
    document.getElementById("eventText").textContent =
      "アイテムがなくなってしまったみたい。";

    return;
  }

  const weights = {
    normal: 1,
    rare: 0.25,
    super: 0.07
  };

  const weighted = pool.map(item => ({
    item,
    weight: weights[item.rarity] || 1
  }));

  const total = weighted.reduce(
    (sum, entry) => sum + entry.weight,
    0
  );

  let random = Math.random() * total;

  let selected = weighted[0].item;

  for (const entry of weighted) {
    random -= entry.weight;

    if (random <= 0) {
      selected = entry.item;
      break;
    }
  }

  const previousItem = { ...selected };
  const previousDraws = { ...draws };
  const previousHistory = history.slice();

  selected.remaining--;

  draws.count++;

  currentItem = selected;

  history.push({
    date: new Date().toLocaleString("ja-JP"),
    item: selected.name
  });

  if (!safeSave()) {
    Object.assign(selected, previousItem);

    draws = previousDraws;
    history = previousHistory;
    currentItem = null;

    alert(
      "抽選結果を保存できませんでした。" +
      "ブラウザーの保存容量を確認してください。"
    );

    return;
  }

  document.getElementById("resultName").textContent =
    selected.name;

  document.getElementById("resultCaption").textContent =
    state.winLine || "";

  const resultImage = document.getElementById("resultImage");

  if (selected.image) {
    resultImage.src = selected.image;
    resultImage.classList.remove("hidden");
  } else {
    resultImage.removeAttribute("src");
    resultImage.classList.add("hidden");
  }

  openPanel("resultArea");

  document.getElementById("eventText").textContent = "";

  showCat();
  updateDraw();
};

      "<": "&lt;",

      '"': "&quot;",

    })[char]

  const svg = `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="700" height="420" viewBox="0 0 700 420">

    <rect x="10" y="10" width="680" height="400"
          fill="#f7f6f2" stroke="#292929" stroke-width="3"/>

          font-size="25" fill="#888"

    <text x="350" y="180" text-anchor="middle"

          font-family="sans-serif">${escapeXML(caption)}</text>

    <text x="350" y="355" text-anchor="middle"
          font-size="36" fill="#999">🐾</text>

  </svg>`;

  const blob = new Blob(

  const link = document.createElement("a");

  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

/* =========================================
   管理者ログイン
========================================= */

async function hashPassword(value) {
  if (!window.crypto || !window.crypto.subtle) {
    throw new Error(
      "安全なパスワード照合を利用できません。HTTPSで開いてください。"
    );
  }

  const digest = await crypto.subtle.digest(
    "SHA-256",
    new TextEncoder().encode(value)
  );

  return Array.from(new Uint8Array(digest))
    .map(byte => byte.toString(16).padStart(2, "0"))
    .join("");
}

document.getElementById("loginBtn").onclick = async () => {
  const input = document.getElementById("adminPassword");

  const message = document.getElementById("loginMessage");

  const button = document.getElementById("loginBtn");

  button.disabled = true;

  try {
    const hash = await hashPassword(input.value);

    if (hash === PASSWORD_HASH) {
      admin = true;

      message.textContent = "ログインしました。";

      showAdmin();

    } else {
      message.textContent = "パスワードが違います。";
    }

  } catch (error) {
    message.textContent = error.message;

  } finally {
    button.disabled = false;
  }
};
